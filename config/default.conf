# reelwait config (bash). Salin ke ~/.config/reelwait/config lalu ubah.
# Tab /shorts channel YouTube (pasti vertikal) atau "ytsearchN:kata kunci".
SOURCES=("https://www.youtube.com/@Fireship/shorts" "https://www.youtube.com/@TheCodingSloth/shorts" "https://www.youtube.com/@ThePrimeTimeagen/shorts" "https://www.youtube.com/@PatrickAlphaC/shorts")
LOCAL_DIR=""               # opsional, folder video lokal
DELAY=8                    # detik sebelum panel muncul
MODE=""                    # kosong = otomatis: window (jendela mengambang) kalau ada layar, pane (tmux) kalau tidak
WINDOW="300x533-24+64"     # mode window: ukuran & posisi (default pojok kanan atas)
PANE_SIZE=40%              # mode pane: lebar split pane
MUTE=yes
MAX_CACHE_MB=500
MAX_HEIGHT=480             # resolusi download
VO=""                      # mode pane: kosong = otomatis; kitty = tajam (Orca/kitty/Ghostty/WezTerm), tct = blok warna
MPV_OPTS=""                # opsi mpv tambahan, mis. "--volume=60"
